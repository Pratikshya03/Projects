<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Update Form</title>
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css"
	integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T"
	crossorigin="anonymous">
</head>
<body>
 <br></br>
   <div class="container">
   
      <div class="col-md-6 offset-md-3">
      
         <div class="card">
      
         <div class="card-header">
           <h2 class="text-center">Update</h2>
         </div>
      
         <div class="card-body">
         
             <form th:action="@{/saveEmployee}" th:object="${employee}" method="POST">
              
              
              <div class="form-group mb-3">
                <input th:field="*{id}" type="hidden" class="form-control" id="firstname">
              </div>
              
              
              <div class="form-group mb-3">
               <label for="firstname">First Name:</label>
                <input th:field="*{firstname}" type="text" class="form-control" id="firstname">
              </div>
              
                <div class="form-group mb-3">
               <label for="lastname">Last Name:</label>
                <input th:field="*{lastname}" type="text" class="form-control" id="lastname">
              </div>
              
              <div class="form-group mb-3">
							<label for="phn_no">Phone no:</label> 
							<input th:field="*{phn_no}" type="text" class="form-control" id="phn_no">
						</div>
						
                <div class="form-group mb-3">
               <label for="email">Email:</label>
                <input th:field="*{email}" type="text" class="form-control" id="email">
              </div>
              <button type="submit" class="btn btn-primary">Update</button>
             
             </form>
         </div>
      
      </div>
     
      
      </div>
      
      
   </div>

</body>
</html>
